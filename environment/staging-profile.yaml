# profile-agent-service, standalone pod — release: multi-agent-retail-advisor-profile
security:
  dataClassification: "Internal"
  dataDesignation: ["MI"]

ownership:
  driEmail: alberto.camarena@mongodb.com

env:
  AWS_REGION: us-east-1
  SERVICE: profile
  # Kanopy-specific: listen on the chart's default port (8080) so no
  # services[]/containerPort override is needed. Local/docker-compose keeps 9091.
  PROFILE_AGENT_PORT: "8080"
  # Advertised in this agent's own A2A card `url`. This release has its own
  # ingress (see .drone.yml), so use that public hostname — an external caller
  # fetching /.well-known/agent-card.json gets a real, independently-reachable URL.
  A2A_HOST: multi-agent-retail-advisor-profile.industrysolutions.staging.corp.mongodb.com
  MONGODB_DATABASE: multi-agent-retail-advisor
  LLM_MODEL: claude-sonnet-4-5

envSecrets:
  MONGODB_URI: multi-agent-retail-advisor-secrets
  LLM_API_KEY: multi-agent-retail-advisor-secrets
  LLM_BASE_URL: multi-agent-retail-advisor-secrets

serviceAccount:
  enabled: true
  irsa:
    accountId: "275662791714"
    roleName: "kanopy-staging-cicd-irsa"

# planner-agent-service, standalone pod — release: multi-agent-retail-advisor-planner
security:
  dataClassification: "Internal"
  dataDesignation: ["MI"]

ownership:
  driEmail: alberto.camarena@mongodb.com

env:
  AWS_REGION: us-east-1
  SERVICE: planner
  # Kanopy-specific: listen on the chart's default port (8080) so no
  # services[]/containerPort override is needed. Local/docker-compose keeps 8081.
  PLANNER_AGENT_PORT: "8080"
  # Advertised in this agent's own A2A card `url`. This release has its own
  # ingress (see .drone.yml), so use that public hostname — an external caller
  # fetching /.well-known/agent-card.json gets a real, independently-reachable URL.
  A2A_HOST: multi-agent-retail-advisor-planner.industrysolutions.staging.corp.mongodb.com
  # Internal calls to the other specialists use cluster-internal Service DNS
  # (plain "<release>-web-app" — ingress: true means no port suffix).
  PROFILE_AGENT_URL: http://multi-agent-retail-advisor-profile-web-app:80
  PRODUCT_AGENT_URL: http://multi-agent-retail-advisor-product-web-app:80
  MONGODB_DATABASE: multi-agent-retail-advisor
  LLM_MODEL: claude-sonnet-4-5

envSecrets:
  MONGODB_URI: multi-agent-retail-advisor-secrets
  LLM_API_KEY: multi-agent-retail-advisor-secrets
  LLM_BASE_URL: multi-agent-retail-advisor-secrets

serviceAccount:
  enabled: true
  irsa:
    accountId: "275662791714"
    roleName: "kanopy-staging-cicd-irsa"

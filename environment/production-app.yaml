# frontend (main container) + orchestrator (sidecar) — release: multi-agent-retail-advisor-prod
security:
  dataClassification: "Internal"
  dataDesignation: ["MI"]

ownership:
  driEmail: alberto.camarena@mongodb.com

env:
  NODE_ENV: prod
  AWS_REGION: us-east-1
  # Same pod as the orchestrator sidecar — reach it over loopback.
  BACKEND_URL: http://localhost:8080

envSecrets: {}

## Orchestrator sidecar — talks to the 3 standalone specialist releases below over
## their in-cluster Service DNS. Each of those releases has ingress: true (its own
## public hostname too, for independent discovery), so the chart names their
## Service the plain "<release>-web-app" (no port suffix — that only applies when
## ingress is disabled).
sidecarContainers:
  - name: orchestrator
    image: 795250896452.dkr.ecr.us-east-1.amazonaws.com/industrysolutions/multi-agent-retail-advisor-backend-prod:prod-latest
    env:
      - name: SERVICE
        value: orchestrator
      - name: PLANNER_AGENT_URL
        value: http://multi-agent-retail-advisor-planner-prod-web-app:80
      - name: PROFILE_AGENT_URL
        value: http://multi-agent-retail-advisor-profile-prod-web-app:80
      - name: PRODUCT_AGENT_URL
        value: http://multi-agent-retail-advisor-product-prod-web-app:80
      - name: MONGODB_DATABASE
        value: multi-agent-retail-advisor
      - name: LLM_MODEL
        value: claude-sonnet-4-5
      # Same secret group name as staging — different clusters/contexts
      # (api.staging vs api.prod), so no naming collision.
      - name: MONGODB_URI
        valueFrom:
          secretKeyRef:
            name: multi-agent-retail-advisor-secrets
            key: MONGODB_URI
      - name: LLM_API_KEY
        valueFrom:
          secretKeyRef:
            name: multi-agent-retail-advisor-secrets
            key: LLM_API_KEY
      - name: LLM_BASE_URL
        valueFrom:
          secretKeyRef:
            name: multi-agent-retail-advisor-secrets
            key: LLM_BASE_URL

serviceAccount:
  enabled: true
  irsa:
    accountId: "275662791714"
    roleName: "kanopy-prod-cicd-irsa"
